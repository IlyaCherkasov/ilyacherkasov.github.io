<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countdown Timer on pure JavaScript</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @media (prefers-reduced-motion: no-preference) {
        :root {
          scroll-behavior: smooth;
        }
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          'Liberation Sans',
          sans-serif,
          'Apple Color Emoji',
          'Segoe UI Emoji',
          'Segoe UI Symbol',
          'Noto Color Emoji';
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      body > div {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 10%);
        border-radius: 20px;
        padding: 20px;
      }

      p {
        font-size: 30px;
        margin: 0;
        color: #FDB827;
        margin-bottom: -15px;
      }

      .timer {
        display: grid;
        grid-template-columns: 4.5rem 0.5rem 4.5rem 0.5rem 4.5rem 0.5rem 4.5rem;
        font-size: 3rem;
        justify-items: center;
      }

      .timer__item, .separator {
        position: relative;
        font-weight: 700;
        color: green
      }

      .timer__item::before {
        content: attr(data-title);
        display: block;
        position: absolute;
        bottom: -0.50rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.875rem;
        font-weight: 700;
        color: white;
      }
    </style>
  </head>

  <body>
    <div>
      <p>Стрим уже идет:</p>
      <div class="timer">
        <div class="timer__item timer__days">00</div>
        <div class="separator">:</div>
        <div class="timer__item timer__hours">00</div>
        <div class="separator">:</div>
        <div class="timer__item timer__minutes">00</div>
        <div class="separator">:</div>
        <div class="timer__item timer__seconds">00</div>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Установите конечную дату
        const startTime = new Date('2026-01-17T21:00:00');

        // Найдите элементы DOM
        const elDays = document.querySelector('.timer__days');
        const elHours = document.querySelector('.timer__hours');
        const elMinutes = document.querySelector('.timer__minutes');
        const elSeconds = document.querySelector('.timer__seconds');

        // Функция склонения числительных
        const declensionNum = (num, words) => {
          return words[
            num % 100 > 4 && num % 100 < 20
              ? 2
              : [2, 0, 1, 1, 1, 2][num % 10 < 5 ? num % 10 : 5]
          ];
        };

        // Функция обновления таймера
        const updateTimer = () => {
          const now = new Date();
          const diff = Math.max(0, now - startTime);

          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);

          elDays.textContent = String(days).padStart(2, '0');
          elHours.textContent = String(hours).padStart(2, '0');
          elMinutes.textContent = String(minutes).padStart(2, '0');
          elSeconds.textContent = String(seconds).padStart(2, '0');

          elDays.dataset.title = declensionNum(days, ['день', 'дня', 'дней']);
          elHours.dataset.title = declensionNum(hours, [
            'час',
            'часа',
            'часов',
          ]);
          elMinutes.dataset.title = declensionNum(minutes, [
            'минута',
            'минуты',
            'минут',
          ]);
          elSeconds.dataset.title = declensionNum(seconds, [
            'секунда',
            'секунды',
            'секунд',
          ]);

          if (diff === 0) {
            clearInterval(timerId);
          }
        };

        // Запустите таймер
        updateTimer();
        const timerId = setInterval(updateTimer, 1000);
      });
    </script>
  </body>
</html>
